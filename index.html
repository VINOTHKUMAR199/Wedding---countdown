<body>
<div class="page">
  <div class="overlay">
    <h1 class="title">Our Wedding Countdown</h1>
    <p class="subtitle">Two hearts <span class="heart">♥</span> One journey <span class="heart">♥</span> Forever</p>
    <div class="countdown" id="countdown">
      <div class="unit"><span class="num" id="days">--</span><span class="label">Days</span></div>
      <div class="unit"><span class="num" id="hours">--</span><span class="label">Hours</span></div>
      <div class="unit"><span class="num" id="minutes">--</span><span class="label">Minutes</span></div>
      <div class="unit"><span class="num" id="seconds">--</span><span class="label">Seconds</span></div>
    </div>
    <div class="date">11 November 2026 · 9:15 AM · MS Mahal</div>
  </div>
</div>
<script>
const target = new Date("2026-11-11T09:15:00+05:30").getTime();
function update() {
  const diff = Math.max(0, target - Date.now());
  const d = Math.floor(diff / 86400000);
  const h = Math.floor(diff / 3600000) % 24;
  const m = Math.floor(diff / 60000) % 60;
  const s = Math.floor(diff / 1000) % 60;
  document.getElementById("days").textContent = String(d).padStart(2,"0");
  document.getElementById("hours").textContent = String(h).padStart(2,"0");
  document.getElementById("minutes").textContent = String(m).padStart(2,"0");
  document.getElementById("seconds").textContent = String(s).padStart(2,"0");
  if (diff === 0) document.querySelector(".title").textContent = "The Wedding Day Is Here ♥";
}
update();
setInterval(update, 1000);
</script>
</body>
